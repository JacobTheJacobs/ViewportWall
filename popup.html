<!doctype html>
<html><head><meta charset="utf-8"><title>Viewport Wall</title>
<style>
  body{margin:0;width:300px;font:13px/1.4 system-ui,sans-serif;background:#0f1115;color:#e6e8ee}
  .wrap{padding:14px}
  h1{font-size:14px;margin:0 0 10px;letter-spacing:.3px}
  .cur{font-size:11px;color:#8b93a7;margin-bottom:2px}
  .url{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px}
  button{width:100%;padding:9px;border:0;border-radius:6px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer;font-size:13px}
  button.secondary{background:#1d2230;color:#e6e8ee;margin-top:8px}
  .sets{margin:14px 0 4px;font-size:11px;color:#8b93a7;text-transform:uppercase;letter-spacing:.5px}
  label{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:4px;cursor:pointer}
  label:hover{background:#1d2230}
  label span.d{color:#8b93a7;font-size:11px;margin-left:auto}
</style></head><body><div class="wrap">
<h1>Viewport Wall</h1>
<div class="cur">Current page</div>
<div class="url" id="url">…</div>
<button id="open">Open Device Wall</button>
<div class="sets">Quick sets</div>
<div id="sets"></div>
<button class="secondary" id="pick">Choose devices…</button>
</div><script type="module" src="popup.js"></script></body></html>
